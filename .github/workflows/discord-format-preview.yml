name: Discord format preview

on:
  workflow_dispatch:

jobs:
  send-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send sample daily digest (업종/회사소개/시가총액 확인용)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          pip install -q requests
          python - <<'PY'
          import os
          import hub

          if not os.environ.get('DISCORD_WEBHOOK_URL'):
              raise SystemExit('No Discord webhook is configured')
          item = hub.RankedTicker(
              'CHWY',
              [{'signal': 'guidance_up', 'source_bot': 'guidance',
                'detected_at': '2026-09-11T00:00:00+00:00', 'summary': '가이던스 상향 (TEST)'}],
              '미보유', 7, True,
          )
          report = hub.build_daily(
              [item],
              market_caps={'CHWY': '120.00억 USD'},
              company_infos={'CHWY': '온라인 유통 · 반려동물 용품 판매'},
          )
          report = report.replace(
              '# 투자 신호 일일보고:',
              '# [TEST 포맷 미리보기] 투자 신호 일일보고:',
              1,
          )
          hub.post_discord(report)
          print('Sent format preview')
          PY
